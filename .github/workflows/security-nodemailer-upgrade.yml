name: Security Nodemailer Upgrade

on:
  push:
    branches:
      - 'security/nodemailer-9-0-5'

permissions:
  contents: write

jobs:
  upgrade-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[nodemailer-upgrade-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Generate dependency update
        run: npm install nodemailer@9.0.5 --save-exact

      - name: Run tests
        run: npm test

      - name: Verify high-severity audit is clean
        run: npm audit --audit-level=high

      - name: Commit generated package files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency file changes to commit."
          else
            git commit -m "security: upgrade nodemailer to 9.0.5 [nodemailer-upgrade-generated]"
            git push origin HEAD:security/nodemailer-9-0-5
          fi
