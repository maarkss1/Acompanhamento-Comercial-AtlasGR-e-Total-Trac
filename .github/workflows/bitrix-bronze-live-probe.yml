name: Bitrix Bronze Live Probe (manual)

on:
  workflow_dispatch:
    inputs:
      portal:
        description: Portal a validar em leitura
        required: true
        type: choice
        options:
          - atlasgr
          - totaltrac
      max_records:
        description: Máximo de registros por entidade nesta amostra
        required: true
        default: '100'
        type: choice
        options:
          - '50'
          - '100'
          - '250'
      confirmation:
        description: Digite READ_ONLY_LIVE_PROBE para confirmar leitura real
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bitrix-bronze-live-probe-${{ inputs.portal }}
  cancel-in-progress: false

jobs:
  live-read-probe:
    name: live-read-probe
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpi_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cpi_probe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cpi_probe
      BITRIX_PORTAL: ${{ inputs.portal }}
      BITRIX_MAX_RECORDS: ${{ inputs.max_records }}
      BITRIX_LIVE_PROBE_CONFIRMATION: ${{ inputs.confirmation }}
      BITRIX_WEBHOOK_ATLASGR: ${{ secrets.BITRIX_WEBHOOK_URL }}
      BITRIX_WEBHOOK_TOTALTRAC: ${{ secrets.BITRIX_TOTALTRAC_WEBHOOK_URL }}

    steps:
      - name: Verify explicit read-only confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BITRIX_LIVE_PROBE_CONFIRMATION" != "READ_ONLY_LIVE_PROBE" ]; then
            echo "::error::Live probe blocked: explicit READ_ONLY_LIVE_PROBE confirmation is required."
            exit 1
          fi

      - name: Prepare ephemeral output paths
        shell: bash
        run: |
          set -euo pipefail
          echo "BRONZE_SQL_OUT=$RUNNER_TEMP/bitrix-bronze-live.sql" >> "$GITHUB_ENV"
          echo "BRONZE_MANIFEST_OUT=$RUNNER_TEMP/bitrix-bronze-live-manifest.json" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select portal secret without printing it
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BITRIX_PORTAL" = "atlasgr" ]; then
            selected="$BITRIX_WEBHOOK_ATLASGR"
            secret_name="BITRIX_WEBHOOK_URL"
          else
            selected="$BITRIX_WEBHOOK_TOTALTRAC"
            secret_name="BITRIX_TOTALTRAC_WEBHOOK_URL"
          fi
          if [ -z "$selected" ]; then
            echo "::error::Required repository secret ${secret_name} is not configured for portal ${BITRIX_PORTAL}."
            exit 1
          fi
          echo "::add-mask::$selected"
          printf 'BITRIX_WEBHOOK_URL=%s\n' "$selected" >> "$GITHUB_ENV"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Apply Bronze migrations to ephemeral PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for migration in db/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done

      - name: Read bounded Bitrix sample and prepare Bronze load
        run: node scripts/bitrix-bronze-live-probe.mjs

      - name: Load sample into ephemeral PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f "$BRONZE_SQL_OUT" >/dev/null

      - name: Publish safe aggregate summary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const m = JSON.parse(readFileSync(process.env.BRONZE_MANIFEST_OUT, 'utf8'));
          console.log('## Bitrix Bronze live probe — safe summary');
          console.log('');
          console.log(`Portal: **${process.env.BITRIX_PORTAL}**`);
          console.log(`Limite por entidade: **${process.env.BITRIX_MAX_RECORDS}**`);
          console.log('');
          console.log('| Entidade | Status | Lidos | Válidos | Inválidos |');
          console.log('|---|---|---:|---:|---:|');
          for (const r of m.runs || []) {
            console.log(`| ${r.entidade} | ${r.status} | ${r.registros_lidos} | ${r.registros_validos} | ${r.registros_invalidos} |`);
          }
          console.log('');
          console.log(`Rejeições auditadas: **${Number(m.rejeicoes || 0)}**`);
          console.log('');
          console.log('Nenhum payload bruto, SQL, webhook, título, telefone ou e-mail é publicado por este workflow.');
          NODE

          psql -v ON_ERROR_STOP=1 -At <<'SQL' >> "$GITHUB_STEP_SUMMARY"
          SELECT E'\nSnapshots persistidos no PostgreSQL efêmero: **' ||
                 ((SELECT count(*) FROM intelligence.staging_negocios) +
                  (SELECT count(*) FROM intelligence.staging_leads)) || '**';
          SQL

      - name: Remove ephemeral files
        if: always()
        shell: bash
        run: |
          rm -f "${BRONZE_SQL_OUT:-}" "${BRONZE_MANIFEST_OUT:-}"
